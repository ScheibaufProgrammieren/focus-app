<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>FocusGuard</h1>
          <span class="status">System Active</span>
        </div>
      </div>
    </header>

    <!-- Stats Card -->
    <section class="stats-section">
      <div class="stats-card">
        <span class="stats-label">Loops Blocked</span>
        <div class="stats-count" id="blocked-count">0</div>
        <span class="stats-subtext">Dopamine loops prevented</span>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls-section">
      <h2>Block Policies</h2>
      
      <!-- YouTube Blocker Switch -->
      <div class="control-row">
        <div class="control-info">
          <h3>Block YouTube Shorts</h3>
          <p>Redirects Shorts to main homepage</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="yt-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Instagram Blocker Switch -->
      <div class="control-row">
        <div class="control-info">
          <h3>Block Instagram Reels</h3>
          <p>Removes Reels viewports and tabs</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="ig-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button id="reset-btn" class="secondary-btn">Reset Stats</button>
      <span class="version">v1.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
